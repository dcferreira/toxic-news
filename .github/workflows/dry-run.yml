name: Dry Run

# Runs the pipeline on a pull request, against the real outlets, and stops short
# of publishing anything: the token is read-only and every output stays on the
# runner, so nothing can reach the site even if a step misbehaves. The day's
# CSVs and pages are attached to the run as artefacts, and the per-outlet
# result is written to the job summary.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Checked out only so the averages have their real history to rebuild
      # from. Nothing in this job writes back to it.
      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: public
          path: public

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --frozen

      - name: Cache the scoring models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-dcferreira-detoxify-optimized-cardiffnlp-twitter-xlm-roberta-base-sentiment

      # `models.py` loads with `local_files_only=True`, so a cold cache has to
      # be filled explicitly instead of failing the run.
      - name: Populate the model cache
        run: uv run poe models

      - name: Work out the day's paths
        run: echo "DAY=$(date -u +%Y/%m/%d)" >> "$GITHUB_ENV"

      - name: Run the pipeline
        run: uv run python toxic_news/main.py update

      - name: Summarise the run
        if: always()
        run: uv run python toxic_news/main.py summary --report "$GITHUB_STEP_SUMMARY"

      - name: Upload the day's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toxic-news-dry-run
          path: |
            data/headlines/${{ env.DAY }}.csv
            public/daily/${{ env.DAY }}.csv
            public/averages
            public/*.html
          if-no-files-found: warn
          retention-days: 14
