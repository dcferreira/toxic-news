name: Backend CI

# Pushes to main, and every pull request: a PR branch would otherwise be built
# twice, once for the push and once for the PR.
on:
  push:
    branches: [main]
  pull_request:

# Pull requests run this too, so it gets no more than it needs to read the code.
permissions:
  contents: read

jobs:
  run:
    name: Run on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11"]
        os: ["ubuntu-22.04"]

    steps:
      - uses: actions/checkout@v7

      - name: Check for CRLF endings
        shell: bash
        run: |
          bad=$(git ls-files --eol -- . ':(exclude)tests/assets/html' \
                  | awk '$1 ~ /^i\/(crlf|mixed)$/ { print $4 }')
          if [ -n "$bad" ]; then
            echo "::error::These files are committed with CRLF or mixed line endings:"
            echo "$bad"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --frozen

      - name: Lint
        run: uv run poe lint

      - name: Type check
        run: uv run poe types

      - name: Test
        run: uv run poe cov
