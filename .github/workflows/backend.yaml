name: Backend CI

on: push

jobs:
  run:
    name: Run on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11"]
        os: ["ubuntu-22.04"]

    steps:
      - uses: actions/checkout@v4

      - name: Check for CRLF endings
        shell: bash
        run: |
          bad=$(git ls-files --eol -- . ':(exclude)tests/assets/html' \
                  | awk '$1 ~ /^i\/(crlf|mixed)$/ { print $4 }')
          if [ -n "$bad" ]; then
            echo "::error::These files are committed with CRLF or mixed line endings:"
            echo "$bad"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --frozen

      - name: Lint
        run: uv run poe lint

      - name: Type check
        run: uv run poe types

      - name: Install Mongo daemon
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-6.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org

      - name: Test
        run: uv run poe cov
