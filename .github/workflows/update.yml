name: Update

on:
  schedule:
    # Daily: scrape, score, aggregate and publish the day's front pages.
    - cron: "0 12 * * *"
    # Weekly: refetch the days GitHub skipped, from the Wayback Machine.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run by hand
        type: choice
        options: ["update", "heal"]
        default: "update"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  update:
    # A schedule only ever fires on the default branch, and the manual trigger
    # is pinned to it too, so a run can never publish from a side branch.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event.schedule == '0 12 * * *' || inputs.job == 'update')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: public
          path: public

      - name: Check out the data branch, creating it on the first run
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git worktree add -B data data FETCH_HEAD
          else
            git worktree add --detach data
            git -C data switch --orphan data
            mkdir -p data/headlines
            printf '%s\n' \
              '# Raw headline data' \
              '' \
              'One CSV per day of scraped and scored headlines, one row per headline,' \
              'written by the `Update` workflow. This is the pipeline'"'"'s source of' \
              'truth: the daily and averages CSVs on the `public` branch are derived' \
              'from these files.' > data/README.md
            git -C data add -A
            git -C data commit -m "chore: initialise the data branch"
            git -C data push origin data
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --frozen

      - name: Cache the scoring models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-dcferreira-detoxify-optimized-cardiffnlp-twitter-xlm-roberta-base-sentiment

      # `models.py` loads with `local_files_only=True`, so a cold cache has to
      # be filled explicitly instead of failing the run.
      - name: Populate the model cache
        run: uv run poe models

      # Also writes the day's health report into the data branch, which the
      # raw-data push below commits alongside the headlines.
      - name: Scrape, score and publish
        run: uv run poe update --raw-html-dir raw-html

      - name: Push the published site
        run: |
          set -euo pipefail
          cd public
          git add .
          if git diff --cached --quiet; then
            echo "Nothing changed in public/"
          else
            git commit -m "daily update $(date +%Y-%m-%d)"
            git push origin public
          fi

      - name: Push the raw data
        run: |
          set -euo pipefail
          cd data
          git add .
          if git diff --cached --quiet; then
            echo "Nothing changed in data/"
          else
            git commit -m "daily update $(date +%Y-%m-%d)"
            git push origin data
          fi

      # Diagnostics come after the pushes, and can never fail the job: losing
      # them is fine, losing the day's data is not.

      # What every outlet actually served today, for debugging a broken
      # extractor against the exact page it failed on.
      - name: Keep the fetched front pages
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: raw-html
          path: raw-html/
          retention-days: 14
          if-no-files-found: ignore
          # a re-run of the job uploads again under the same name
          overwrite: true

      - name: Report each outlet's health
        if: always()
        continue-on-error: true
        run: uv run poe summary --report "$GITHUB_STEP_SUMMARY"

  heal:
    # GitHub skips scheduled runs, so a day can go missing entirely. Once a
    # week, refetch the missing days from the Wayback Machine.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event.schedule == '0 6 * * 1' || inputs.job == 'heal')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: public
          path: public

      - name: Check out the data branch, creating it on the first run
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git worktree add -B data data FETCH_HEAD
          else
            git worktree add --detach data
            git -C data switch --orphan data
            mkdir -p data/headlines
            printf '%s\n' \
              '# Raw headline data' \
              '' \
              'One CSV per day of scraped and scored headlines, one row per headline,' \
              'written by the `Update` workflow. This is the pipeline'"'"'s source of' \
              'truth: the daily and averages CSVs on the `public` branch are derived' \
              'from these files.' > data/README.md
            git -C data add -A
            git -C data commit -m "chore: initialise the data branch"
            git -C data push origin data
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --frozen

      - name: Cache the scoring models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-dcferreira-detoxify-optimized-cardiffnlp-twitter-xlm-roberta-base-sentiment

      - name: Populate the model cache
        run: uv run poe models

      - name: Heal the days GitHub skipped
        run: uv run poe heal

      - name: Push the published site
        run: |
          set -euo pipefail
          cd public
          git add .
          if git diff --cached --quiet; then
            echo "Nothing changed in public/"
          else
            git commit -m "heal skipped days $(date +%Y-%m-%d)"
            git push origin public
          fi

      - name: Push the raw data
        run: |
          set -euo pipefail
          cd data
          git add .
          if git diff --cached --quiet; then
            echo "Nothing changed in data/"
          else
            git commit -m "heal skipped days $(date +%Y-%m-%d)"
            git push origin data
          fi
